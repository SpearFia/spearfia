[package]
name = "spearfia-desktop"
description = "Spear Fia desktop app: native Rust UI (egui), like FilmCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "spearfia-desktop"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui.workspace = true
rfd = "0.17"
serde_json.workspace = true
skrifa = "0.44"
spearfia-adapter-filmcraft.workspace = true
spearfia-catalog.workspace = true
spearfia-core.workspace = true
spearfia-script.workspace = true
spearfia-vision.workspace = true
spearfia-ops.workspace = true

[target.'cfg(windows)'.dependencies]
mouse_position = "0.1.4"
